<!DOCTYPE html>
<html>

<head>
  <title>jsPsychTimedtapping Example</title>
  <script src="https://unpkg.com/jspsych"></script>
  <!-- Once this plugin package is published, you can load it from a CDN instead:
<script src="https://unpkg.com/@jspsych-contrib/plugin-timedtapping"></script> -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2"></script>
  <script src="../dist/index.browser.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css" />
</head>

<body></body>
<script>
  const jsPsych = initJsPsych({
    on_finish: function () {
      jsPsych.data.displayData();
    }
  });

  const intro = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div style="max-width: 700px; margin: auto;">
        <h2>Timed Tapping Plugin Examples</h2>
        <p>This demo shows various configurations of the timedtapping plugin.</p>
        <p>You will complete trials involving different tapping scenarios:</p>
        <ul style="text-align: left;">
          <li>Spacebar tapping with a fixed cued portion.</li>
          <li>Button tapping with a synchronization routine.</li>
          <li>Spacebar tapping with a progress bar for the uncued portion.</li>
          <li>Spacebar tapping with an auditory cue.</li>
        </ul>
        <p><strong>Instructions:</strong> Respond in sync with the cue and keep responding with the same frequency after the cue disappears.</p>
        <p>Press SPACEBAR key to begin.</p>
      </div>
    `,
    choices: [" "]
  };


  const space_fixed = {
    type: jsPsychTimedtapping,
    wait_for_sync: false,
    intercue_interval: 500,
    cued_duration: 4000,
    uncued_duration: 4000,
    show_progress: false,
    response_mode: "keyboard",
    cue_modality: "visual",
  }

  const button_sync = {
    type: jsPsychTimedtapping,
    wait_for_sync: true,
    intercue_interval: 500,
    uncued_duration: 4000,
    cued_prompt: "Press the button in sync with the cue",
    sync_tolerance: 150,
    num_taps_for_sync: 3,
    show_progress: false,
    response_mode: "button",
    cue_modality: "visual",
  }

  const space_progress = {
    type: jsPsychTimedtapping,
    wait_for_sync: false,
    intercue_interval: 500,
    cued_duration: 4000,
    uncued_duration: 4000,
    progress_interval: 333,
    response_mode: "keyboard",
    cue_modality: "visual",
  }

  const button_audio = {
    type: jsPsychTimedtapping,
    wait_for_sync: false,
    intercue_interval: 500,
    cued_duration: 4000,
    uncued_duration: 4000,
    show_progress: true,
    response_mode: "keyboard",
    cue_modality: "auditory",
  }

  const done = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div style="max-width: 700px; margin: auto;">
        <h2>All Done!</h2>
        <p>Thank you for checking the plugin.</p>
        <p>Press SPACEBAR to finish and check your data.</p>
      </div>
    `,
    choices: [" "]
  }


  jsPsych.run([intro, space_fixed, button_sync, space_progress, button_audio])
</script>

</html>
