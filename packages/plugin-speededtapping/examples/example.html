<!DOCTYPE html>
<html>

<head>
  <title>jsPsychSpeededTapping Example</title>
  <script src="https://unpkg.com/jspsych"></script>
  <!-- Once this plugin package is published, you can load it from a CDN instead:
<script src="https://unpkg.com/@jspsych-contrib/plugin-speededtapping"></script> -->
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2"></script>
  <script src="../dist/index.browser.min.js"></script>

  <link rel="stylesheet" href="https://unpkg.com/jspsych/css/jspsych.css" />
</head>

<body></body>
<script>
  const jsPsych = initJsPsych({
    on_finish: function () {
      jsPsych.data.displayData();
    }
  });

  const intro = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div style="max-width: 700px; margin: auto;">
        <h2>Timed Tapping Plugin Examples</h2>
        <p>This demo shows various configurations of the speededtapping plugin.</p>
        <p>You will complete trials involving different tapping scenarios:</p>
        <ul style="text-align: left;">
          <li>Spacebar tapping with a countdown.</li>
          <li>Button tapping with a short countdown and a progress bar.</li>
        </ul>
        <p><strong>Instructions:</strong> Tap as quickly as possible.</p>
        <p>Press SPACEBAR key to begin.</p>
      </div>
    `,
    choices: [" "]
  };


  const space = {
    type: jsPsychSpeededTapping,
    trial_duration: 4000,
    show_progress: false,
    response_mode: "keyboard",
  }

  const button_progress = {
    type: jsPsychSpeededTapping,
    trial_duration: 4000,
    countdown_duration: 2000,
    show_progress: true,
    response_mode: "button",
  }

  const done = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: `
      <div style="max-width: 700px; margin: auto;">
        <h2>All Done!</h2>
        <p>Thank you for checking the plugin.</p>
        <p>Press SPACEBAR to finish and check your data.</p>
      </div>
    `,
    choices: [" "]
  }


  jsPsych.run([intro, space, button_progress, done])
</script>

</html>
